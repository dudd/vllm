<script>
"use strict";
(function(){
  const content = document.getElementById("content");
  const toc = document.getElementById("toc");
  const phaseNav = document.getElementById("phaseNav");
  const typeFilter = document.getElementById("typeFilter");
  const searchBoxes = [document.getElementById("searchBox"), document.getElementById("searchBox2")];
  const searchStats = document.getElementById("searchStats");
  const legend = document.getElementById("legend");

  const TYPE_LABEL = {sync:"同步", async:"异步", threadpool:"线程池", ipc:"IPC", gpu:"GPU", sse:"SSE 流式", proc:"子进程", branch:"分支"};
  // legend
  legend.innerHTML = "<span style='font-weight:600'>调用类型：</span>" +
    Object.entries(TYPE_LABEL).map(([k,v])=>`<span class="chip ${k}">${v}</span>`).join(" ");

  // build types
  const types = new Set();
  DATA.phases.forEach(p=>p.steps.forEach(s=>(s.types||[]).forEach(t=>types.add(t))));
  Object.keys(TYPE_LABEL).forEach(t=>{
    if(types.has(t)){
      const o=document.createElement("option"); o.value=t; o.textContent=TYPE_LABEL[t]; typeFilter.appendChild(o);
    }
  });

  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  function escLinks(s){ // allow a[href] through esc
    return String(s).replace(/&/g,"&amp;").replace(/"(?![^<]*>")/g,"&quot;");
  }

  // render phases & steps
  const stepEls = [];
  DATA.phases.forEach((phase, pi)=>{
    const sec = document.createElement("section");
    sec.className = "phase"; sec.id = phase.id;
    const head = document.createElement("div"); head.className="phase-head";
    head.innerHTML = `<h2>${esc(phase.title)}</h2><span class="meta">${esc(phase.meta||"")}</span>`;
    sec.appendChild(head);
    if(phase.desc){const d=document.createElement("div");d.className="phase-desc";d.innerHTML=phase.desc;sec.appendChild(d);}
    phase.steps.forEach((step, si)=>{
      const id = `${phase.id}-s${si+1}`;
      step._id = id;
      const card = document.createElement("article");
      card.className = "step"; card.id = id;
      const chips = (step.types||[]).map(t=>`<span class="chip ${t}">${TYPE_LABEL[t]||t}</span>`).join("") +
        (step.tags||[]).map(t=>`<span class="chip branch">${esc(t)}</span>`).join("");
      card.innerHTML = `
        <div class="step-head">
          <span class="step-num">${esc(step.num||String(si+1))}</span>
          <div style="flex:1;min-width:0">
            <div class="step-title">${esc(step.title)}</div>
            <div class="step-chips">${chips}</div>
          </div>
        </div>
        <div class="step-body">
          ${step.purpose?`<div class="field"><div class="label">用途</div><div style="font-size:.88rem">${esc(step.purpose)}</div></div>`:""}
          ${step.input?`<div class="field"><div class="label">入参</div><div style="font-size:.85rem;color:var(--fg2)">${esc(step.input)}</div></div>`:""}
          ${step.output?`<div class="field"><div class="label">出参 / 副作用</div><div style="font-size:.85rem;color:var(--fg2)">${esc(step.output)}</div></div>`:""}
          ${step.logic?`<div class="field"><div class="label">基础逻辑</div><ol>${step.logic.map(l=>`<li>${esc(l)}</li>`).join("")}</ol></div>`:""}
          ${step.note?`<div class="note${step.noteKind?" "+step.noteKind:""}">${esc(step.note)}</div>`:""}
          ${step.next?`<div class="next-hop"><span class="label">下一跳 →</span><div>${esc(step.next)}</div></div>`:""}
          ${step.src?`<div class="src-links">${step.src.map(l=>`<span>${l}</span>`).join("")}</div>`:""}
        </div>`;
      sec.appendChild(card);
      stepEls.push({step, card});
    });
    content.appendChild(sec);
    // phase nav
    const a=document.createElement("a"); a.href="#"+phase.id; a.textContent=phase.title.replace(/^P\d+\s*/,""); a.dataset.phase=phase.id;
    phaseNav.appendChild(a);
  });

  // collapsible
  content.addEventListener("click", e=>{
    const h = e.target.closest(".step-head");
    if(!h) return;
    const body = h.parentElement.querySelector(".step-body");
    const open = body.style.display !== "none";
    body.style.display = open ? "none" : "";
  });
  function setAll(open){
    content.querySelectorAll(".step-body").forEach(b=>b.style.display = open?"":"none");
  }
  document.getElementById("expandAll").onclick=()=>setAll(true);
  document.getElementById("collapseAll").onclick=()=>setAll(false);

  // src link helper expected format in data: {zed:"path:line", cur:"path:line", raw:"path:line", label}
  // but simpler: data src entries are pre-rendered strings; we instead build them here from step.srcList
  // (kept for compatibility)

  // search & filter
  let query="", typeSel="";
  function applyFilter(){
    let shown=0, total=stepEls.length;
    const q = query.trim().toLowerCase();
    stepEls.forEach(({step, card})=>{
      const okType = !typeSel || (step.types||[]).includes(typeSel);
      const hay = (step.title+" "+(step.purpose||"")+" "+(step.next||"")+" "+(step.srcText||"")).toLowerCase();
      const okQ = !q || hay.includes(q);
      const show = okType && okQ;
      card.classList.toggle("hidden", !show);
      if(show) shown++;
    });
    // hide empty phases
    DATA.phases.forEach(p=>{
      const sec=document.getElementById(p.id);
      if(!sec) return;
      const any = p.steps.some(s=>!document.getElementById(s._id).classList.contains("hidden"));
      sec.style.display = any?"":"none";
    });
    searchStats.textContent = shown===total ? `共 ${total} 个步骤` : `匹配 ${shown} / ${total} 个步骤`;
  }
  function syncBoxes(v){searchBoxes.forEach(b=>{if(b.value!==v)b.value=v;});}
  searchBoxes.forEach(b=>b.addEventListener("input", ()=>{query=b.value;syncBoxes(b.value);applyFilter();}));
  typeFilter.addEventListener("change", ()=>{typeSel=typeFilter.value;applyFilter();});
  applyFilter();

  // theme
  const saved = localStorage.getItem("vllm-doc-theme");
  if(saved) document.documentElement.dataset.theme = saved;
  else if(window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme="dark";
  document.getElementById("themeToggle").onclick=()=>{
    const t = document.documentElement.dataset.theme==="dark"?"light":"dark";
    document.documentElement.dataset.theme=t; localStorage.setItem("vllm-doc-theme",t);
  };

  // sidebar toggle (mobile)
  const sb=document.getElementById("sidebar");
  document.getElementById("sidebarToggle").onclick=()=>sb.classList.toggle("open");
  document.addEventListener("click", e=>{
    if(window.innerWidth<=1000 && sb.classList.contains("open") && !sb.contains(e.target) && e.target.id!=="sidebarToggle")
      sb.classList.remove("open");
  });

  // TOC build
  const groups = {};
  DATA.phases.forEach(p=>{
    if(!groups[p.navGroup||""]) groups[p.navGroup||""]=[];
    groups[p.navGroup||""].push({id:p.id,title:p.title,steps:p.steps});
  });
  Object.entries(groups).forEach(([g,phases])=>{
    const gd=document.createElement("div"); gd.className="toc-group";
    if(g){const t=document.createElement("div");t.className="toc-group-title";t.textContent=g;gd.appendChild(t);}
    phases.forEach(p=>{
      const pa=document.createElement("a"); pa.href="#"+p.id; pa.textContent=p.title.replace(/^P\d+\s*/,""); gd.appendChild(pa);
      p.steps.forEach(s=>{
        const sa=document.createElement("a"); sa.href="#"+s._id; sa.style.paddingLeft="18px"; sa.style.fontSize=".78rem";
        sa.textContent=(s.num?s.num+" ":"")+s.title;
        gd.appendChild(sa);
      });
    });
    toc.appendChild(gd);
  });

  // scroll spy (simple)
  const spy = ()=>{
    let cur=null;
    const ids=[...content.querySelectorAll(".phase")].map(p=>p.id);
    for(const id of ids){const el=document.getElementById(id); if(el && el.getBoundingClientRect().top<120) cur=id;}
    toc.querySelectorAll("a").forEach(a=>a.classList.toggle("active", a.getAttribute("href")==="#"+cur));
    phaseNav.querySelectorAll("a").forEach(a=>a.classList.toggle("active", a.getAttribute("href")==="#"+cur));
  };
  window.addEventListener("scroll", spy, {passive:true}); spy();
})();
</script>
</body>
</html>
