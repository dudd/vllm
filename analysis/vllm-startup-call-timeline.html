<style>
:root{
  --bg:#f7f8fa; --bg2:#ffffff; --fg:#1a202c; --fg2:#4a5568; --fg3:#718096;
  --border:#e2e8f0; --accent:#2563eb; --accent2:#7c3aed; --ok:#059669; --warn:#d97706; --err:#dc2626;
  --card:#ffffff; --code-bg:#f1f5f9; --code-fg:#0f172a; --chip-op:rgba(37,99,235,.08);
  --shadow:0 1px 3px rgba(0,0,0,.08); --shadow-lg:0 8px 24px rgba(0,0,0,.10);
}
html[data-theme="dark"]{
  --bg:#0d1117; --bg2:#161b22; --fg:#e6edf3; --fg2:#9aa4b2; --fg3:#6e7a89;
  --border:#30363d; --accent:#58a6ff; --accent2:#bc8cff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
  --card:#161b22; --code-bg:#1c2128; --code-fg:#e6edf3; --chip-op:rgba(88,166,255,.12);
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
code{background:var(--code-bg);color:var(--code-fg);padding:.1em .35em;border-radius:4px;font-size:.9em}
pre{background:var(--code-bg);color:var(--code-fg);padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:.85rem;line-height:1.5;border:1px solid var(--border)}
pre code{background:none;padding:0}

/* layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 14px 32px;z-index:20}
.main{flex:1;min-width:0;padding:24px 32px 80px;max-width:1080px;margin:0 auto}
@media (max-width:1000px){
  .layout{display:block}
  .sidebar{position:fixed;left:0;top:0;width:290px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lg);height:100vh}
  .sidebar.open{transform:translateX(0)}
  .main{padding:16px 14px 60px}
}
#sidebarToggle{display:none;position:fixed;top:10px;left:10px;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:1rem;color:var(--fg)}
@media (max-width:1000px){#sidebarToggle{display:block}}

/* header */
header.hero{margin-bottom:20px}
header.hero h1{font-size:1.65rem;margin:0 0 6px;line-height:1.3}
header.hero .sub{color:var(--fg2);font-size:.95rem}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{display:inline-block;font-size:.75rem;background:var(--chip-op);color:var(--accent);border:1px solid var(--border);border-radius:99px;padding:2px 10px}

/* controls */
.controls{position:sticky;top:0;background:var(--bg);z-index:10;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls input[type=search]{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--fg);font-size:.9rem}
.controls select{padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--fg);font-size:.85rem}
#themeToggle{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--fg)}
#searchStats{font-size:.8rem;color:var(--fg3);width:100%}

/* phase nav */
.phase-nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.phase-nav a{font-size:.8rem;padding:4px 12px;border-radius:99px;border:1px solid var(--border);background:var(--bg2);color:var(--fg2)}
.phase-nav a.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* phase section */
.phase{margin:34px 0 8px;scroll-margin-top:70px}
.phase-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.phase-head h2{font-size:1.25rem;margin:0;border-left:4px solid var(--accent);padding-left:10px}
.phase-head .meta{font-size:.8rem;color:var(--fg3)}
.phase-desc{color:var(--fg2);font-size:.9rem;margin:6px 0 12px;padding-left:14px}

/* step card */
.step{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin:14px 0;scroll-margin-top:80px;overflow:hidden}
.step.hidden{display:none}
.step-head{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;cursor:pointer;user-select:none}
.step-head:hover{background:var(--chip-op)}
.step-num{flex-shrink:0;font-weight:700;font-size:.8rem;color:#fff;background:var(--accent);border-radius:8px;min-width:34px;text-align:center;padding:3px 6px;margin-top:2px}
.step-title{font-weight:600;font-size:.98rem;flex:1}
.step-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{font-size:.7rem;padding:1px 8px;border-radius:99px;border:1px solid transparent;font-weight:500}
.chip.sync{background:rgba(5,150,105,.12);color:var(--ok);border-color:rgba(5,150,105,.3)}
.chip.async{background:rgba(37,99,235,.12);color:var(--accent);border-color:rgba(37,99,235,.3)}
.chip.threadpool{background:rgba(217,119,6,.14);color:var(--warn);border-color:rgba(217,119,6,.3)}
.chip.ipc{background:rgba(124,58,237,.14);color:var(--accent2);border-color:rgba(124,58,237,.3)}
.chip.gpu{background:rgba(220,38,38,.12);color:var(--err);border-color:rgba(220,38,38,.3)}
.chip.sse{background:rgba(14,165,233,.14);color:#0ea5e9;border-color:rgba(14,165,233,.3)}
.chip.proc{background:rgba(107,114,128,.14);color:var(--fg2);border-color:rgba(107,114,128,.3)}
html[data-theme="dark"] .chip.sse{color:#7dd3fc}
.chip.branch{background:rgba(234,88,12,.12);color:#ea580c;border-color:rgba(234,88,12,.35)}
.step-body{padding:0 16px 14px 60px;border-top:1px dashed var(--border)}
@media (max-width:640px){.step-body{padding-left:16px}}
.step-body .field{margin:10px 0}
.step-body .label{font-size:.72rem;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.step-body ol{margin:4px 0 0;padding-left:20px;font-size:.88rem;color:var(--fg)}
.step-body ol li{margin:3px 0}
.next-hop{font-size:.85rem;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-top:8px}
.next-hop .label{font-size:.7rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.src-links{font-size:.78rem;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--fg3)}
.src-links a{white-space:nowrap}
.note{font-size:.85rem;color:var(--fg2);background:var(--chip-op);border-left:3px solid var(--accent2);padding:6px 10px;border-radius:0 8px 8px 0;margin-top:8px}
.note.warn{border-left-color:var(--warn)}
.note.err{border-left-color:var(--err)}

/* toc */
.toc-group{margin-bottom:4px}
.toc-group-title{font-size:.72rem;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
.toc-group a{display:block;font-size:.83rem;padding:2px 6px;border-radius:6px;color:var(--fg2)}
.toc-group a:hover{background:var(--chip-op);text-decoration:none}
.toc-group a.active{color:var(--accent);font-weight:600}
mark{background:rgba(250,204,21,.5);color:inherit;border-radius:2px;padding:0 1px}
html[data-theme="dark"] mark{background:rgba(250,204,21,.35)}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;font-size:.78rem;color:var(--fg2);align-items:center}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--border);color:var(--fg3);font-size:.8rem}

<script>
"use strict";
(function(){
  const content = document.getElementById("content");
  const toc = document.getElementById("toc");
  const phaseNav = document.getElementById("phaseNav");
  const typeFilter = document.getElementById("typeFilter");
  const searchBoxes = [document.getElementById("searchBox"), document.getElementById("searchBox2")];
  const searchStats = document.getElementById("searchStats");
  const legend = document.getElementById("legend");

  const TYPE_LABEL = {sync:"同步", async:"异步", threadpool:"线程池", ipc:"IPC", gpu:"GPU", sse:"SSE 流式", proc:"子进程", branch:"分支"};
  // legend
  legend.innerHTML = "<span style='font-weight:600'>调用类型：</span>" +
    Object.entries(TYPE_LABEL).map(([k,v])=>`<span class="chip ${k}">${v}</span>`).join(" ");

  // build types
  const types = new Set();
  DATA.phases.forEach(p=>p.steps.forEach(s=>(s.types||[]).forEach(t=>types.add(t))));
  Object.keys(TYPE_LABEL).forEach(t=>{
    if(types.has(t)){
      const o=document.createElement("option"); o.value=t; o.textContent=TYPE_LABEL[t]; typeFilter.appendChild(o);
    }
  });

  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  function escLinks(s){ // allow a[href] through esc
    return String(s).replace(/&/g,"&amp;").replace(/"(?![^<]*>")/g,"&quot;");
  }

  // render phases & steps
  const stepEls = [];
  DATA.phases.forEach((phase, pi)=>{
    const sec = document.createElement("section");
    sec.className = "phase"; sec.id = phase.id;
    const head = document.createElement("div"); head.className="phase-head";
    head.innerHTML = `<h2>${esc(phase.title)}</h2><span class="meta">${esc(phase.meta||"")}</span>`;
    sec.appendChild(head);
    if(phase.desc){const d=document.createElement("div");d.className="phase-desc";d.innerHTML=phase.desc;sec.appendChild(d);}
    phase.steps.forEach((step, si)=>{
      const id = `${phase.id}-s${si+1}`;
      step._id = id;
      const card = document.createElement("article");
      card.className = "step"; card.id = id;
      const chips = (step.types||[]).map(t=>`<span class="chip ${t}">${TYPE_LABEL[t]||t}</span>`).join("") +
        (step.tags||[]).map(t=>`<span class="chip branch">${esc(t)}</span>`).join("");
      card.innerHTML = `
        <div class="step-head">
          <span class="step-num">${esc(step.num||String(si+1))}</span>
          <div style="flex:1;min-width:0">
            <div class="step-title">${esc(step.title)}</div>
            <div class="step-chips">${chips}</div>
          </div>
        </div>
        <div class="step-body">
          ${step.purpose?`<div class="field"><div class="label">用途</div><div style="font-size:.88rem">${esc(step.purpose)}</div></div>`:""}
          ${step.input?`<div class="field"><div class="label">入参</div><div style="font-size:.85rem;color:var(--fg2)">${esc(step.input)}</div></div>`:""}
          ${step.output?`<div class="field"><div class="label">出参 / 副作用</div><div style="font-size:.85rem;color:var(--fg2)">${esc(step.output)}</div></div>`:""}
          ${step.logic?`<div class="field"><div class="label">基础逻辑</div><ol>${step.logic.map(l=>`<li>${esc(l)}</li>`).join("")}</ol></div>`:""}
          ${step.note?`<div class="note${step.noteKind?" "+step.noteKind:""}">${esc(step.note)}</div>`:""}
          ${step.next?`<div class="next-hop"><span class="label">下一跳 →</span><div>${esc(step.next)}</div></div>`:""}
          ${step.src?`<div class="src-links">${step.src.map(l=>`<span>${l}</span>`).join("")}</div>`:""}
        </div>`;
      sec.appendChild(card);
      stepEls.push({step, card});
    });
    content.appendChild(sec);
    // phase nav
    const a=document.createElement("a"); a.href="#"+phase.id; a.textContent=phase.title.replace(/^P\d+\s*/,""); a.dataset.phase=phase.id;
    phaseNav.appendChild(a);
  });

  // collapsible
  content.addEventListener("click", e=>{
    const h = e.target.closest(".step-head");
    if(!h) return;
    const body = h.parentElement.querySelector(".step-body");
    const open = body.style.display !== "none";
    body.style.display = open ? "none" : "";
  });
  function setAll(open){
    content.querySelectorAll(".step-body").forEach(b=>b.style.display = open?"":"none");
  }
  document.getElementById("expandAll").onclick=()=>setAll(true);
  document.getElementById("collapseAll").onclick=()=>setAll(false);

  // src link helper expected format in data: {zed:"path:line", cur:"path:line", raw:"path:line", label}
  // but simpler: data src entries are pre-rendered strings; we instead build them here from step.srcList
  // (kept for compatibility)

  // search & filter
  let query="", typeSel="";
  function applyFilter(){
    let shown=0, total=stepEls.length;
    const q = query.trim().toLowerCase();
    stepEls.forEach(({step, card})=>{
      const okType = !typeSel || (step.types||[]).includes(typeSel);
      const hay = (step.title+" "+(step.purpose||"")+" "+(step.next||"")+" "+(step.srcText||"")).toLowerCase();
      const okQ = !q || hay.includes(q);
      const show = okType && okQ;
      card.classList.toggle("hidden", !show);
      if(show) shown++;
    });
    // hide empty phases
    DATA.phases.forEach(p=>{
      const sec=document.getElementById(p.id);
      if(!sec) return;
      const any = p.steps.some(s=>!document.getElementById(s._id).classList.contains("hidden"));
      sec.style.display = any?"":"none";
    });
    searchStats.textContent = shown===total ? `共 ${total} 个步骤` : `匹配 ${shown} / ${total} 个步骤`;
  }
  function syncBoxes(v){searchBoxes.forEach(b=>{if(b.value!==v)b.value=v;});}
  searchBoxes.forEach(b=>b.addEventListener("input", ()=>{query=b.value;syncBoxes(b.value);applyFilter();}));
  typeFilter.addEventListener("change", ()=>{typeSel=typeFilter.value;applyFilter();});
  applyFilter();

  // theme
  const saved = localStorage.getItem("vllm-doc-theme");
  if(saved) document.documentElement.dataset.theme = saved;
  else if(window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme="dark";
  document.getElementById("themeToggle").onclick=()=>{
    const t = document.documentElement.dataset.theme==="dark"?"light":"dark";
    document.documentElement.dataset.theme=t; localStorage.setItem("vllm-doc-theme",t);
  };

  // sidebar toggle (mobile)
  const sb=document.getElementById("sidebar");
  document.getElementById("sidebarToggle").onclick=()=>sb.classList.toggle("open");
  document.addEventListener("click", e=>{
    if(window.innerWidth<=1000 && sb.classList.contains("open") && !sb.contains(e.target) && e.target.id!=="sidebarToggle")
      sb.classList.remove("open");
  });

  // TOC build
  const groups = {};
  DATA.phases.forEach(p=>{
    if(!groups[p.navGroup||""]) groups[p.navGroup||""]=[];
    groups[p.navGroup||""].push({id:p.id,title:p.title,steps:p.steps});
  });
  Object.entries(groups).forEach(([g,phases])=>{
    const gd=document.createElement("div"); gd.className="toc-group";
    if(g){const t=document.createElement("div");t.className="toc-group-title";t.textContent=g;gd.appendChild(t);}
    phases.forEach(p=>{
      const pa=document.createElement("a"); pa.href="#"+p.id; pa.textContent=p.title.replace(/^P\d+\s*/,""); gd.appendChild(pa);
      p.steps.forEach(s=>{
        const sa=document.createElement("a"); sa.href="#"+s._id; sa.style.paddingLeft="18px"; sa.style.fontSize=".78rem";
        sa.textContent=(s.num?s.num+" ":"")+s.title;
        gd.appendChild(sa);
      });
    });
    toc.appendChild(gd);
  });

  // scroll spy (simple)
  const spy = ()=>{
    let cur=null;
    const ids=[...content.querySelectorAll(".phase")].map(p=>p.id);
    for(const id of ids){const el=document.getElementById(id); if(el && el.getBoundingClientRect().top<120) cur=id;}
    toc.querySelectorAll("a").forEach(a=>a.classList.toggle("active", a.getAttribute("href")==="#"+cur));
    phaseNav.querySelectorAll("a").forEach(a=>a.classList.toggle("active", a.getAttribute("href")==="#"+cur));
  };
  window.addEventListener("scroll", spy, {passive:true}); spy();
})();
</script>
</body>
